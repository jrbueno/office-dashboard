<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1, user-scalable=no">
  <title>Office HQ</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage theme-light" id="stage">
    <nav class="rail" id="rail">
      <button class="rail-item is-active" data-go="today">
        <svg class="i" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>Today</span>
      </button>
      <button class="rail-item" data-go="chores">
        <svg class="i" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M7.5 12l3 3 6-6"/></svg><span>Chores</span>
      </button>
      <button class="rail-item" data-go="cameras">
        <svg class="i" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3"/></svg><span>Cameras</span>
      </button>
      <button class="rail-item" data-go="home">
        <svg class="i" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span>Home</span>
      </button>
      <div class="rail-status" id="railStatus" title="Home Assistant connection"></div>
    </nav>

    <main class="views">
      <section class="view is-active" id="view-today"></section>
      <section class="view" id="view-chores"></section>
      <section class="view" id="view-cameras"></section>
      <section class="view" id="view-home"></section>
    </main>

    <div class="overlay" id="overlay"></div>
    <div class="toast" id="toast"></div>
    <div class="night" id="night"></div>
  </div>

  <script src="secrets.js"></script>
  <script src="config.js"></script>
  <script src="ha.js"></script>
  <script src="app.js"></script>
</body>
</html>
